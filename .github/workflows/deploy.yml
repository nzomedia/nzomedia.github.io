name: Build et Deploy GH Page

on:
  push:
    branches: [ main ]

# Donne les permissions nécessaires pour modifier les builds GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Permet d'annuler les déploiements en cours si un nouveau push arrive
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build_site:
    runs-on: ubuntu-latest

    steps:
      - name: Récupération du code
        uses: actions/checkout@v4

      - name: Configuration de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Installation des dépendances
        run: npm install

      - name: Construction du projet
        run: npm run build

      - name: Télécharger l'artefact dist/ pour GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist' # Indique à GitHub d'empaqueter le dossier dist/

  deploy_site:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build_site # Attend que le build soit terminé
    steps:
      - name: Déployer vers GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
